<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>族群數量模擬</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .wrapper {
      max-width: 680px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.6px;
      margin-bottom: 48px;
    }
    .navigation-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 560px) {
      .navigation-links {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      background: #f7f7f8;
      border: 1.5px solid #e5e5e7;
      border-radius: 12px;
      text-decoration: none;
      color: #111111;
      font-size: 20px;
      font-weight: 600;
      transition: background 0.18s, border-color 0.18s, transform 0.18s;
      letter-spacing: -0.2px;
    }
    .nav-btn:hover {
      background: #ededf0;
      border-color: #bbbbbf;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="wrapper">
  <h1>族群數量模擬</h1>

  <div class="navigation-links">
    <a href="continuous.html" class="nav-btn">連續型模型</a>
    <a href="discrete.html" class="nav-btn">離散型模型</a>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>環境負荷量與族群成長模擬器 - 模型選擇</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .portal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 600px;
      width: 100%;
      padding: 42px 36px;
      text-align: center;
    }
    .portal-title {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }
    .portal-desc {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 540px) {
      .button-grid { grid-template-columns: 1fr; }
    }
    .model-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px 20px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.18s ease;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      color: #1e293b;
    }
    .model-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(37,99,235,0.12);
      border-color: #2563eb;
      background: #ffffff;
    }
    .model-btn.discrete:hover {
      box-shadow: 0 8px 20px rgba(225,29,72,0.12);
      border-color: #e11d48;
    }
    .btn-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .badge-continuous { background: #dbeafe; color: #1d4ed8; }
    .badge-discrete { background: #ffe4e6; color: #be123c; }
    .btn-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }
    .btn-sub {
      font-size: 12px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>

<div class="portal-card">
  <h1 class="portal-title">環境負荷量與族群成長模擬器</h1>
  <p class="portal-desc">歡迎使用族群成長與採收模擬器。<br>請選擇您欲互動探索的數學模型：</p>

  <div class="button-grid">
    <a href="continuous.html" class="model-btn">
      <span class="btn-badge badge-continuous">微積分模型</span>
      <span class="btn-title">連續型模型 (Continuous)</span>
      <span class="btn-sub">以 dN/dt 微分方程模擬<br>呈現平滑 S 型成長曲線</span>
    </a>

    <a href="discrete.html" class="model-btn discrete">
      <span class="btn-badge badge-discrete">世代迭代模型</span>
      <span class="btn-title">離散型模型 (Discrete)</span>
      <span class="btn-sub">以 N<sub>t+1</sub> 差分方程模擬<br>可探索超越震盪與混沌 (Chaos)</span>
    </a>
  </div>
</div>

</body>
</html>
